      <section>

        <div id="linear1"></div>
        <div id="linear2"></div>

      <section>

        <div id="radial1"></div>
        <div id="radial2"></div>

      <section>

          <div id="child">

          </div>

        <div id="box">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quaerat, cum?</div>

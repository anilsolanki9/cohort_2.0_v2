<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nothing Phone 1 - Made by AnilSolanki</title>

    <link rel="shortcut icon" href="./assets/favicon.svg" type="image/x-icon" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div id="section1">
        <svg class="circuits" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <filter x="-50%" y="-60%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
              <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
              </feMerge>
            </filter>
          </defs>

          <!-- Lines starting from just under the NOTHING logo (small gap) -->
          <g transform="translate(-5,71)">
            <!-- Main top line starting slightly under NOTHING logo -->
            <path
              d="M300 95 L360 95 L520 165"
              stroke="#ffffff"
              stroke-width="4"
              fill="none"
              stroke-linecap="square"
              stroke-linejoin="miter"
              filter="url(#glow)"
              data-darkreader-inline-stroke=""
              style="--darkreader-inline-stroke: var(--darkreader-text-ffffff, #ffffff)"
            ></path>

            <!-- Main horizontal run (top) -->
            <path
              d="M520 165 L640 165 L760 165 L920 165"
              stroke="#ffffff"
              stroke-width="4"
              fill="none"
              stroke-linecap="butt"
              filter="url(#glow)"
              data-darkreader-inline-stroke=""
              style="--darkreader-inline-stroke: var(--darkreader-text-ffffff, #ffffff)"
            ></path>

            <!-- Second angled section going down toward phone -->
            <path
              d="M920 165 L1080 245"
              stroke="#ffffff"
              stroke-width="4"
              fill="none"
              stroke-linecap="square"
              filter="url(#glow)"
              data-darkreader-inline-stroke=""
              style="--darkreader-inline-stroke: var(--darkreader-text-ffffff, #ffffff)"
            ></path>

            <!-- Right horizontal band behind phone -->
            <path
              d="M1080 245 L1590 245"
              stroke="#ffffff"
              stroke-width="4"
              fill="none"
              stroke-linecap="square"
              filter="url(#glow)"
              data-darkreader-inline-stroke=""
              style="--darkreader-inline-stroke: var(--darkreader-text-ffffff, #ffffff)"
            ></path>

            <!-- Thin parallel stepped path under the main center run to match image -->
            <path
              d="M570 169 L680 240 L700 229 L960 225 L1080 300 L1590 299"
              stroke="#ffffff"
              stroke-width="2.6"
              fill="none"
              stroke-linecap="butt"
              opacity="0.95"
              filter="url(#glow)"
              data-darkreader-inline-stroke=""
              style="--darkreader-inline-stroke: var(--darkreader-text-ffffff, #ffffff)"
            ></path>

            <!-- Lower horizontal band with angled sections moved down (fixed start X) -->
            <path
              d="M10 610 L680 620 L860 550 L1290 540 L1580 540"
              stroke="#ffffff"
              stroke-width="4"
              fill="none"
              stroke-linecap="square"
              stroke-linejoin="miter"
              filter="url(#glow)"
              data-darkreader-inline-stroke=""
              style="--darkreader-inline-stroke: var(--darkreader-text-ffffff, #ffffff)"
            ></path>
          </g>
        </svg>

        <nav>
          <div id="left" class="btn">
            <h2>Nothing</h2>
            <img src="./assets/Group5.svg" alt="" />
          </div>

          <div id="mid" class="btn">
            <input type="search" name="" id="" placeholder="Search here..." />
            <img src="./assets/Group4.png" alt="" />
          </div>

          <div id="right">
            <div id="nav1" class="btn">
              <h3>Store</h3>
              <img src="./assets/Group5.svg" alt="" />
            </div>
            <div id="nav2" class="btn">
              <h3>Support</h3>
              <img src="./assets/Group5.svg" alt="" />
            </div>
            <div id="nav3" class="btn">
              <h3>Community</h3>
              <img src="./assets/Group5.svg" alt="" />
            </div>
          </div>
        </nav>

        <div id="phones">
          <img id="p1" src="./assets/Rectangle 41.png" alt="" />
          <img id="p2" src="./assets/BA_ABR_300_1001.png" alt="" />
        </div>

        <div id="title">
          <h1>NOTHING PHONE <span>(1)</span><br />PURE INSTINCT</h1>

          <p>SNAPDRAGON 778G+ | 50 MP Dual Camera</p>
        </div>
      </div>
      <div id="section2">
        <img src="./assets/water.png" alt="" />
        <div id="phone">
          <p>IP53</p>
          <img src="./assets/Rectangle 41.png" alt="" />
        </div>
      </div>
    </main>
  </body>
</html>
